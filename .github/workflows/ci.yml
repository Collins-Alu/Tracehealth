name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tracehealth
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: tracehealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracehealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://tracehealth:ci_password@localhost:5432/tracehealth
      TEST_DATABASE_URL: postgresql+psycopg://tracehealth:ci_password@localhost:5432/tracehealth_test
      # CI-only throwaway secret; real environments set their own
      JWT_SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create test database
        run: PGPASSWORD=ci_password psql -h localhost -U tracehealth -d tracehealth -c "CREATE DATABASE tracehealth_test;"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Tests
        run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --ci

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Component tests
        run: npx vitest run
      - name: Production build
        run: npx vite build

  # NFR 5: the dashboard in real Google Chrome and Microsoft Edge, against
  # the real API with the synthetic seed data
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tracehealth
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: tracehealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracehealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://tracehealth:ci_password@localhost:5432/tracehealth
      JWT_SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnop
      CORS_ORIGINS: http://localhost:4173
      BACKGROUND_JOBS_ENABLED: "false"
      SEED_DEFAULT_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Start the API with seed data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Install dashboard and browsers
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chrome msedge
      - name: End-to-end tests (Chrome and Edge)
        working-directory: dashboard
        run: npx playwright test
      - name: Keep the report and API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
            api.log
